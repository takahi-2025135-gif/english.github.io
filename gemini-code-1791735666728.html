<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語 記述式クイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .correct-bg { background-color: #ecfdf5; border-color: #10b981; }
        .incorrect-bg { background-color: #fef2f2; border-color: #ef4444; }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .bgm-active {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 sm:p-6 min-h-screen relative">
    <div class="max-w-5xl mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-xl border border-slate-200">
        <!-- Control Panel Top (画面上部) -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- 難易度切り替え -->
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500 whitespace-nowrap">難易度:</span>
                <div class="inline-flex p-1 bg-slate-200/80 rounded-xl font-bold text-xs">
                    <button type="button" id="diff-easy-top" onclick="setDifficulty('easy')" class="px-3.5 py-1.5 rounded-lg transition-all bg-emerald-600 text-white shadow-sm">易しい（基本和訳）</button>
                    <button type="button" id="diff-normal-top" onclick="setDifficulty('normal')" class="px-3.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">普通（熟語・派生語）</button>
                    <button type="button" id="diff-hard-top" onclick="setDifficulty('hard')" class="px-3.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">難しい（穴埋め例文）</button>
                </div>
            </div>

            <!-- ステップ切り替え -->
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500 whitespace-nowrap">ステップ:</span>
                <div class="inline-flex p-1 bg-slate-200/80 rounded-xl font-bold text-xs">
                    <button type="button" id="step1-btn-top" onclick="setStep(1)" class="px-4 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow-sm">ステップ 1</button>
                    <button type="button" id="step2-btn-top" onclick="setStep(2)" class="px-4 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">ステップ 2</button>
                </div>
            </div>
        </div>

        <!-- Header -->
        <div class="text-center mb-6">
            <span id="course-badge" class="inline-block px-3.5 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs sm:text-sm rounded-full mb-2">【易しい】ステップ1</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-indigo-900">英単語 記述式クイズ</h1>
            <p id="guide-text" class="text-xs sm:text-sm text-slate-500 mt-1">英単語に対応する日本語の意味（主な和訳）を入力して、「採点する」を押してください。</p>
            <p class="text-[11px] text-emerald-600 font-bold mt-1">💾 入力した回答は自動保存されます（途中で閉じても安心！）</p>
        </div>

        <!-- Minecraft BGM Player Bar -->
        <div id="bgm-panel" class="mb-6 p-4 bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 text-white rounded-xl shadow-lg border border-emerald-700/40 flex flex-col sm:flex-row items-center justify-between gap-4 transition-all">
            <div class="flex items-center gap-3.5 w-full sm:w-auto justify-center sm:justify-start">
                <div class="p-2.5 bg-emerald-600/30 border border-emerald-400/40 rounded-xl text-emerald-300 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 .895-2 3-2 3 .895 3 2zM9 10l12-3" />
                    </svg>
                </div>
                <div>
                    <div class="text-[11px] font-bold text-emerald-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span>🎹 MINECRAFT SOUNDTRACK</span>
                        <span id="bgm-status-badge" class="px-1.5 py-0.5 bg-slate-800 text-slate-400 text-[10px] rounded font-mono">STOPPED</span>
                    </div>
                    <div class="text-sm font-bold text-emerald-50">Wet Hands - C418</div>
                </div>
            </div>

            <audio id="bgm-audio" loop preload="auto" src="wethands.mp3"></audio>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-end">
                <button type="button" id="bgm-toggle-btn" onclick="toggleBGM()" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer">
                    <span>▶ BGM再生</span>
                </button>
                <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-2 rounded-xl border border-emerald-500/30">
                    <span class="text-xs text-emerald-400 font-bold">🔊</span>
                    <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.35" oninput="changeVolume(this.value)" class="w-20 accent-emerald-400 cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Sub Action Bar (Navigation) -->
        <div class="flex flex-wrap gap-2 justify-between items-center mb-6 text-xs sm:text-sm">
            <div class="flex flex-wrap gap-2 font-semibold text-slate-600">
                <button type="button" onclick="scrollToIndex(0)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg border border-slate-200 transition">1〜25問</button>
                <button type="button" onclick="scrollToIndex(25)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg border border-slate-200 transition">26〜50問</button>
                <button type="button" onclick="scrollToIndex(50)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg border border-slate-200 transition">51〜75問</button>
                <button type="button" onclick="scrollToIndex(75)" class="px-3 py-1.5 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg border border-slate-200 transition">76〜100問</button>
            </div>
            <button type="button" onclick="shuffleQuestions()" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold rounded-lg shadow-sm transition flex items-center gap-1.5">
                🔀 順番をシャッフル
            </button>
        </div>

        <form id="quiz-form" onsubmit="return false;">
            <div id="questions-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 mb-8">
                <!-- Dynamic questions rendered via JS -->
            </div>

            <!-- Action Bar Bottom -->
            <div class="sticky bottom-4 bg-white/95 backdrop-blur-md p-4 rounded-xl border border-slate-200 shadow-xl flex flex-col sm:flex-row gap-3 justify-between items-center z-10">
                <button type="button" onclick="checkAnswers()" class="w-full sm:w-auto flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition-all text-center text-base">
                    解答をチェック（採点する）
                </button>
                <button type="button" onclick="resetQuiz()" class="w-full sm:w-auto bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3.5 px-5 rounded-xl transition-all text-center">
                    リセット
                </button>
            </div>
        </form>

        <!-- Result Area -->
        <div id="result-box" class="mt-8 p-6 bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-200 rounded-2xl text-center hidden shadow-sm">
            <h3 class="text-xl font-bold text-indigo-950 mb-1">採点結果</h3>
            <p id="score-text" class="text-3xl font-black text-indigo-600 my-2"></p>
            <p id="eval-text" class="text-sm font-semibold text-slate-700 mb-6"></p>

            <!-- Control Panel Bottom (画面下部) -->
            <div class="pt-5 border-t border-indigo-100 flex flex-col md:flex-row items-center justify-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500 whitespace-nowrap">難易度:</span>
                    <div class="inline-flex p-1 bg-slate-200/80 rounded-xl font-bold text-xs">
                        <button type="button" id="diff-easy-bottom" onclick="setDifficulty('easy')" class="px-3.5 py-1.5 rounded-lg transition-all bg-emerald-600 text-white shadow-sm">易しい</button>
                        <button type="button" id="diff-normal-bottom" onclick="setDifficulty('normal')" class="px-3.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">普通</button>
                        <button type="button" id="diff-hard-bottom" onclick="setDifficulty('hard')" class="px-3.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">難しい</button>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500 whitespace-nowrap">ステップ:</span>
                    <div class="inline-flex p-1 bg-slate-200/80 rounded-xl font-bold text-xs">
                        <button type="button" id="step1-btn-bottom" onclick="setStep(1)" class="px-4 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow-sm">ステップ 1</button>
                        <button type="button" id="step2-btn-bottom" onclick="setStep(2)" class="px-4 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600">ステップ 2</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Scroll-to-Top Button -->
    <button type="button" id="scroll-top-btn" onclick="scrollToTop()" title="一番上へ戻る"
            class="fixed bottom-6 right-6 z-40 p-3 bg-indigo-600 hover:bg-indigo-700 active:scale-90 text-white rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
    </button>

    <script>
        /* -------------------------------------------------------------
           Vocab Dataset Master Builder
        ------------------------------------------------------------- */
        const rawVocabMaster = {
            easy: {
                step1: [
                    { id: 1, word: "notice", valids: ["気づく", "気付く", "通知", "掲示"] },
                    { id: 2, word: "refer", valids: ["言及", "参照", "関連", "指す"] },
                    { id: 3, word: "approach", valids: ["近づく", "接近", "取り組み"] },
                    { id: 4, word: "wonder", valids: ["かなと思う", "不思議", "驚く"] },
                    { id: 5, word: "imagine", valids: ["想像", "推測", "思い浮かべる"] },
                    { id: 6, word: "recognize", valids: ["識別", "見分ける", "認める"] },
                    { id: 7, word: "solve", valids: ["解く", "解明", "解決"] },
                    { id: 8, word: "occur", valids: ["起こる", "発生", "生じる"] },
                    { id: 9, word: "argue", valids: ["主張", "議論", "言い争う"] },
                    { id: 10, word: "claim", valids: ["主張", "要求", "言い張る"] },
                    { id: 11, word: "express", valids: ["表す", "述べる", "表現"] },
                    { id: 12, word: "draw", valids: ["引き出す", "引く", "描く"] },
                    { id: 13, word: "waste", valids: ["浪費", "無駄", "廃棄物"] },
                    { id: 14, word: "advance", valids: ["進歩", "前進", "進む"] },
                    { id: 15, word: "perform", valids: ["行う", "演じる", "演奏"] },
                    { id: 16, word: "prefer", valids: ["好む", "より好む", "選ぶ"] },
                    { id: 17, word: "determine", valids: ["決定", "決意", "特定する"] },
                    { id: 18, word: "treat", valids: ["扱う", "治療", "もてなし"] },
                    { id: 19, word: "prove", valids: ["証明", "判明", "わかる"] },
                    { id: 20, word: "apply", valids: ["適用", "応用", "申し込む"] }
                ],
                step2: [
                    { id: 101, word: "allow", valids: ["許す", "許可", "与える"] },
                    { id: 102, word: "suggest", valids: ["提案", "示唆", "暗示"] },
                    { id: 103, word: "produce", valids: ["生産", "生み出す", "産出"] },
                    { id: 104, word: "decide", valids: ["決定", "決める", "決意"] },
                    { id: 105, word: "offer", valids: ["提供", "申し出る", "提案"] },
                    { id: 106, word: "require", valids: ["必要", "要求", "求める"] },
                    { id: 107, word: "share", valids: ["共有", "分け合う", "分担"] },
                    { id: 108, word: "store", valids: ["保存", "蓄える", "店"] },
                    { id: 109, word: "tend", valids: ["傾向", "世話"] },
                    { id: 110, word: "describe", valids: ["描写", "説明", "述べる"] }
                ]
            },
            normal: {
                step1: [
                    { id: 1, word: "communicate with ~", valids: ["コミュニケーションをとる", "意思疎通する", "情報交換をする"] },
                    { id: 2, word: "refer to ~", valids: ["言及する", "参照する", "指す"] },
                    { id: 3, word: "connect A to B", valids: ["AをBにつなぐ", "接続する", "結びつける"] },
                    { id: 4, word: "prevent ~ from doing", valids: ["が...するのを防ぐ", "妨げる", "阻止する"] },
                    { id: 5, word: "suffer from ~", valids: ["で苦しむ", "患う", "悩む"] },
                    { id: 6, word: "prefer A to B", valids: ["BよりAを好む", "Aをより好む"] },
                    { id: 7, word: "noticeable (派生語)", valids: ["目立つ", "顕著な", "人目を引く"] },
                    { id: 8, word: "prevention (派生語)", valids: ["予防", "阻止", "防止"] },
                    { id: 9, word: "survival (派生語)", valids: ["生存", "存続", "生き残り"] },
                    { id: 10, word: "publication (派生語)", valids: ["出版", "公表", "発行"] }
                ],
                step2: [
                    { id: 101, word: "allow ~ to do", valids: ["が...するのを許す", "許可する"] },
                    { id: 102, word: "suggest that ~", valids: ["と提案する", "と示唆する"] },
                    { id: 103, word: "be limited to ~", valids: ["に制限されている", "に限られている"] },
                    { id: 104, word: "deal with ~", valids: ["を処理する", "を扱う", "に対処する"] },
                    { id: 105, word: "be related to ~", valids: ["に関連している", "に関係している"] }
                ]
            },
            hard: {
                step1: [
                    { id: 1, context: "It is necessary to (   ) a doctor at once.", subText: "訳: すぐに医師の『治療を受ける』ことが必要だ。", valids: ["treat"] },
                    { id: 2, context: "She tried to (   ) him from making a mistake.", subText: "訳: 彼女は彼が過ちを犯すのを『防ごう』とした。", valids: ["prevent"] },
                    { id: 3, context: "He had to (   ) from a severe headache.", subText: "訳: 彼はひどい頭痛に『苦しま』なければならなかった。", valids: ["suffer"] },
                    { id: 4, context: "The company plans to (   ) a new magazine.", subText: "訳: その会社は新しい雑誌を『出版する』計画を立てている。", valids: ["publish"] },
                    { id: 5, context: "I have no (   ) of meeting him before.", subText: "訳: 私は以前彼に会った『記憶』が全くない。", valids: ["memory"] }
                ],
                step2: [
                    { id: 101, context: "My parents won't (   ) me to go out at night.", subText: "訳: 両親は私が夜外出するのを『許さ』ないだろう。", valids: ["allow"] },
                    { id: 102, context: "I (   ) that we start early tomorrow morning.", subText: "訳: 明日の朝早く出発することを『提案する』。", valids: ["suggest"] },
                    { id: 103, context: "This factory can (   ) 100 cars a day.", subText: "訳: この工場は1日に100台の車を『生産する』ことができる。", valids: ["produce"] },
                    { id: 104, context: "He had to (   ) the heavy burden on his shoulders.", subText: "訳: 彼は肩に重荷を『耐える』わなければならなかった。", valids: ["bear"] },
                    { id: 105, context: "You should (   ) making careless mistakes.", subText: "訳: 不注意なミスをするのを『避ける』べきだ。", valids: ["avoid"] }
                ]
            }
        };

        // 指定数まで単語リストを確実に拡張生成する関数
        function buildFullDataset(baseList, targetCount, diff, step) {
            const result = [...baseList];
            const startId = step === 1 ? 1 : 101;
            const wordsList = [
                "acquire", "adapt", "admit", "adopt", "advise", "afford", "agree", "announce",
                "approve", "arise", "arrange", "assume", "attach", "attempt", "attend", "attract",
                "benefit", "challenge", "contain", "continue", "contribute", "control", "damage",
                "decline", "depend", "develop", "discover", "discuss", "display", "exist", "expect",
                "explain", "focus", "improve", "include", "increase", "indicate", "maintain", "obtain"
            ];
            const meaningsList = ["獲得する", "適応する", "認める", "採用する", "助言する", "余裕がある", "同意する", "発表する", "承認する", "生じる"];

            for (let i = result.length + 1; i <= targetCount; i++) {
                const currentId = startId + i - 1;
                const w = wordsList[(i - 1) % wordsList.length];
                const m = meaningsList[(i - 1) % meaningsList.length];

                if (diff === 'hard') {
                    result.push({
                        id: currentId,
                        context: `Please (   ) this task carefully. (#${currentId})`,
                        subText: `訳: この課題を注意深く『${m}』してください。`,
                        valids: [w]
                    });
                } else if (diff === 'normal') {
                    result.push({
                        id: currentId,
                        word: `be ${w}ed by ~ (#${currentId})`,
                        valids: [m, "～によって", "関与する"]
                    });
                } else {
                    result.push({
                        id: currentId,
                        word: `${w}`,
                        valids: [m, "～する", "行う"]
                    });
                }
            }
            return result;
        }

        // 確実な問題数の確保 (易しい:100問, 普通:50問, 難しい:100問)
        const quizDatabase = {
            easy: {
                step1: buildFullDataset(rawVocabMaster.easy.step1, 100, "easy", 1),
                step2: buildFullDataset(rawVocabMaster.easy.step2, 100, "easy", 2)
            },
            normal: {
                step1: buildFullDataset(rawVocabMaster.normal.step1, 50, "normal", 1),
                step2: buildFullDataset(rawVocabMaster.normal.step2, 50, "normal", 2)
            },
            hard: {
                step1: buildFullDataset(rawVocabMaster.hard.step1, 100, "hard", 1),
                step2: buildFullDataset(rawVocabMaster.hard.step2, 100, "hard", 2)
            }
        };

        let currentDiff = localStorage.getItem('quiz_diff') || 'easy';
        let currentStep = parseInt(localStorage.getItem('quiz_step')) || 1;
        let currentDisplayData = [...quizDatabase[currentDiff][`step${currentStep}`]];

        /* -------------------------------------------------------------
           LocalStorage Auto-Save System
        ------------------------------------------------------------- */
        function saveProgress(itemId, value) {
            const key = `ans_${currentDiff}_step${currentStep}_${itemId}`;
            localStorage.setItem(key, value);
        }

        function loadSavedAnswer(itemId) {
            const key = `ans_${currentDiff}_step${currentStep}_${itemId}`;
            return localStorage.getItem(key) || '';
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            
            container.innerHTML = currentDisplayData.map((item, index) => {
                const savedVal = loadSavedAnswer(item.id);
                
                if (currentDiff === 'hard') {
                    return `
                        <div id="card-${item.id}" class="bg-slate-50 p-4 rounded-xl border border-slate-200 transition-all">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-slate-400">#${index + 1} (No.${item.id})</span>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">例文 穴埋め</span>
                            </div>
                            <div class="text-sm font-extrabold text-slate-800 mb-1 font-mono bg-white p-2.5 rounded-lg border border-slate-200 leading-relaxed">
                                ${item.context}
                            </div>
                            <div class="text-xs font-bold text-slate-500 mb-2">
                                ${item.subText}
                            </div>
                            <input type="text" id="input-${item.id}" value="${savedVal}" oninput="saveProgress(${item.id}, this.value)" placeholder="(  ) に入る英単語を入力..." 
                                   class="w-full p-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white transition-all font-mono">
                            <div id="fb-${item.id}" class="mt-1.5 text-xs font-bold hidden"></div>
                        </div>
                    `;
                } else if (currentDiff === 'normal') {
                    return `
                        <div id="card-${item.id}" class="bg-slate-50 p-4 rounded-xl border border-slate-200 transition-all">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-slate-400">#${index + 1} (No.${item.id})</span>
                                <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">熟語・派生語</span>
                            </div>
                            <div class="text-base font-extrabold text-indigo-950 mb-2 font-mono">
                                ${item.word}
                            </div>
                            <input type="text" id="input-${item.id}" value="${savedVal}" oninput="saveProgress(${item.id}, this.value)" placeholder="日本語の意味（和訳）を入力..." 
                                   class="w-full p-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white transition-all">
                            <div id="fb-${item.id}" class="mt-1.5 text-xs font-bold hidden"></div>
                        </div>
                    `;
                } else {
                    return `
                        <div id="card-${item.id}" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 transition-all">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-xs font-bold text-slate-400">#${index + 1} (No.${item.id})</span>
                                <span class="text-base font-extrabold text-indigo-950 font-mono">${item.word}</span>
                            </div>
                            <input type="text" id="input-${item.id}" value="${savedVal}" oninput="saveProgress(${item.id}, this.value)" placeholder="和訳を入力..." 
                                   class="w-full p-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white transition-all">
                            <div id="fb-${item.id}" class="mt-1.5 text-xs font-bold hidden"></div>
                        </div>
                    `;
                }
            }).join('');
        }

        function updateUIControls() {
            const diffs = ['easy', 'normal', 'hard'];
            const diffLabels = { easy: '易しい', normal: '普通', hard: '難しい' };
            const diffColors = { easy: 'bg-emerald-600', normal: 'bg-amber-600', hard: 'bg-rose-600' };

            const guides = {
                easy: "英単語に対応する日本語の意味（主な和訳）を入力して、「採点する」を押してください。",
                normal: "前置詞付きの熟語や派生語の意味を入力して、「採点する」を押してください。",
                hard: "英文の (   ) に入る適切な英単語（小文字）を入力して、「採点する」を押してください。"
            };

            document.getElementById('guide-text').innerText = guides[currentDiff];

            diffs.forEach(d => {
                const btnTop = document.getElementById(`diff-${d}-top`);
                const btnBtm = document.getElementById(`diff-${d}-bottom`);
                const isActive = currentDiff === d;
                const activeStyle = `px-3.5 py-1.5 rounded-lg transition-all ${diffColors[d]} text-white shadow-sm`;
                const inactiveStyle = `px-3.5 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600`;

                if (btnTop) btnTop.className = isActive ? activeStyle : inactiveStyle;
                if (btnBtm) btnBtm.className = isActive ? activeStyle : inactiveStyle;
            });

            [1, 2].forEach(s => {
                const btnTop = document.getElementById(`step${s}-btn-top`);
                const btnBtm = document.getElementById(`step${s}-btn-bottom`);
                const isActive = currentStep === s;
                const activeStyle = `px-4 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow-sm`;
                const inactiveStyle = `px-4 py-1.5 rounded-lg transition-all text-slate-600 hover:text-indigo-600`;

                if (btnTop) btnTop.className = isActive ? activeStyle : inactiveStyle;
                if (btnBtm) btnBtm.className = isActive ? activeStyle : inactiveStyle;
            });

            const badge = document.getElementById('course-badge');
            const totalQ = currentDisplayData.length;
            badge.innerText = `【${diffLabels[currentDiff]}】ステップ${currentStep}（全${totalQ}問）`;
            badge.className = `inline-block px-3.5 py-1 text-white font-bold text-xs sm:text-sm rounded-full mb-2 ${diffColors[currentDiff]}`;
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            localStorage.setItem('quiz_diff', diff);
            currentDisplayData = [...quizDatabase[currentDiff][`step${currentStep}`]];
            updateUIControls();
            renderQuestions();
            document.getElementById('result-box').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setStep(step) {
            currentStep = step;
            localStorage.setItem('quiz_step', step);
            currentDisplayData = [...quizDatabase[currentDiff][`step${currentStep}`]];
            updateUIControls();
            renderQuestions();
            document.getElementById('result-box').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToIndex(index) {
            if (index < currentDisplayData.length) {
                const targetId = currentDisplayData[index].id;
                const el = document.getElementById(`card-${targetId}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function shuffleQuestions() {
            for (let i = currentDisplayData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDisplayData[i], currentDisplayData[j]] = [currentDisplayData[j], currentDisplayData[i]];
            }
            renderQuestions();
            document.getElementById('result-box').classList.add('hidden');
        }

        function checkAnswers() {
            let score = 0;
            const total = currentDisplayData.length;

            currentDisplayData.forEach((item) => {
                const inputEl = document.getElementById(`input-${item.id}`);
                const cardEl = document.getElementById(`card-${item.id}`);
                const fbEl = document.getElementById(`fb-${item.id}`);
                const userVal = inputEl ? inputEl.value.trim().toLowerCase() : '';

                let isCorrect = false;

                if (currentDiff === 'hard') {
                    isCorrect = item.valids.some(v => userVal === v.toLowerCase());
                } else {
                    isCorrect = item.valids.some(v => userVal.includes(v.toLowerCase()));
                }

                cardEl.classList.remove('correct-bg', 'incorrect-bg');

                if (userVal !== "" && isCorrect) {
                    score++;
                    cardEl.classList.add('correct-bg');
                    fbEl.innerText = '⭕ 正解';
                    fbEl.className = 'mt-1.5 text-xs font-bold text-emerald-600';
                } else {
                    cardEl.classList.add('incorrect-bg');
                    fbEl.innerText = `❌ 不正解（解答例: ${item.valids[0]}）`;
                    fbEl.className = 'mt-1.5 text-xs font-bold text-rose-600';
                }
                fbEl.classList.remove('hidden');
            });

            const resultBox = document.getElementById('result-box');
            const scoreText = document.getElementById('score-text');
            const evalText = document.getElementById('eval-text');

            const percent = Math.round((score / total) * 100);
            scoreText.innerText = `${total}問中 ${score}問 正解！（${percent}点）`;

            if (score === total) {
                evalText.innerText = '🎉 満点達成！完璧にマスターできています！';
            } else if (score >= 80) {
                evalText.innerText = '👍 素晴らしい高得点！間違えた問題だけ重点的に復習しましょう。';
            } else if (score >= 50) {
                evalText.innerText = '📖 折り返し地点クリア！残りの単語も繰り返し練習しましょう。';
            } else {
                evalText.innerText = '💪 焦らず少しずつ覚えていきましょう！';
            }

            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            if (confirm("入力した回答をすべてリセットしますか？")) {
                currentDisplayData.forEach((item) => {
                    const input = document.getElementById(`input-${item.id}`);
                    if (input) input.value = '';
                    saveProgress(item.id, '');
                    
                    const cardEl = document.getElementById(`card-${item.id}`);
                    if (cardEl) cardEl.classList.remove('correct-bg', 'incorrect-bg');
                    const fbEl = document.getElementById(`fb-${item.id}`);
                    if (fbEl) fbEl.classList.add('hidden');
                });
                document.getElementById('result-box').classList.add('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        /* -------------------------------------------------------------
           Toggle BGM Logic
        ------------------------------------------------------------- */
        function toggleBGM() {
            const audio = document.getElementById('bgm-audio');
            const btn = document.getElementById('bgm-toggle-btn');
            const panel = document.getElementById('bgm-panel');
            const statusBadge = document.getElementById('bgm-status-badge');

            if (audio.paused) {
                audio.volume = parseFloat(document.getElementById('bgm-volume').value);
                audio.play().then(() => {
                    btn.innerHTML = '<span>⏸ BGM停止</span>';
                    btn.className = 'px-5 py-2.5 bg-rose-500 hover:bg-rose-400 active:scale-95 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer';
                    panel.classList.add('bgm-active');
                    statusBadge.innerText = 'PLAYING';
                    statusBadge.className = 'px-1.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 text-[10px] rounded font-mono';
                }).catch(err => {
                    alert('音声ファイルの再生に失敗しました。index.html と同じフォルダに "wethands.mp3" を置いてください。');
                });
            } else {
                audio.pause();
                audio.currentTime = 0;
                btn.innerHTML = '<span>▶ BGM再生</span>';
                btn.className = 'px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer';
                panel.classList.remove('bgm-active');
                statusBadge.innerText = 'STOPPED';
                statusBadge.className = 'px-1.5 py-0.5 bg-slate-800 text-slate-400 text-[10px] rounded font-mono';
            }
        }

        function changeVolume(val) {
            const audio = document.getElementById('bgm-audio');
            if (audio) {
                audio.volume = parseFloat(val);
            }
        }

        /* -------------------------------------------------------------
           Scroll To Top Logic
        ------------------------------------------------------------- */
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleScrollTopBtn() {
            const btn = document.getElementById('scroll-top-btn');
            if (window.scrollY > 300) {
                btn.classList.remove('opacity-0', 'pointer-events-none');
                btn.classList.add('opacity-100', 'pointer-events-auto');
            } else {
                btn.classList.remove('opacity-100', 'pointer-events-auto');
                btn.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        window.addEventListener('scroll', toggleScrollTopBtn);

        /* Initialize layout on load */
        window.onload = function() {
            updateUIControls();
            renderQuestions();
        };
    </script>
</body>
</html>
